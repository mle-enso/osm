name: Wear OS UI tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install compile SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      # This repository currently contains wrapper properties but no gradlew / wrapper JAR,
      # so CI installs the exact Gradle version required by the project.
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run UI tests on Wear OS 5.1
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          system-image-api-level: 35-ext15
          target: android-wear
          arch: x86_64
          cores: 2
          ram-size: 2048M
          emulator-options: >-
            -no-window
            -no-snapshot
            -noaudio
            -no-boot-anim
            -gpu swiftshader_indirect
          disable-animations: true
          script: ./ci/run-ui-tests.sh

      - name: Capture emulator diagnostics
        if: failure()
        run: |
          mkdir -p artifacts
          adb exec-out screencap -p > artifacts/failure-screen.png || true
          adb logcat -d > artifacts/logcat.txt || true

      - name: Upload UI test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: wear-os-ui-test-results
          if-no-files-found: warn
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            artifacts/
